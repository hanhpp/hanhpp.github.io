{{- /* Project override of the theme's extend_footer.html hook. */ -}}
{{- if .IsHome }}
<script>
(function () {
    var heading = document.querySelector(".home-info .entry-header h1");
    if (!heading) return;

    var fullText = heading.textContent.trim();
    var chars = Array.from(fullText);

    var cursor = document.createElement("span");
    cursor.className = "typewriter-cursor";
    cursor.setAttribute("aria-hidden", "true");
    cursor.textContent = "▋";

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceMotion) {
        heading.appendChild(cursor);
        return;
    }

    heading.textContent = "";
    heading.appendChild(cursor);

    var i = 0;
    var typeSpeedMs = 70;
    (function typeNext() {
        if (i < chars.length) {
            cursor.insertAdjacentText("beforebegin", chars[i]);
            i++;
            setTimeout(typeNext, typeSpeedMs);
        }
    })();
})();
</script>
{{- end }}

{{- /* Page transition: fade out on navigation click, fade in on load */ -}}
<script>
(function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (!document.startViewTransition) return;

    document.addEventListener("click", function (e) {
        var link = e.target.closest("a[href]");
        if (!link) return;
        var url = new URL(link.href, location.origin);
        if (url.origin !== location.origin) return;
        if (url.pathname === location.pathname) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

        e.preventDefault();
        document.startViewTransition(function () {
            window.location.href = link.href;
        });
    });
})();
</script>
