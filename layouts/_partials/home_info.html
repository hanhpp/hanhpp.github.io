{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info home-info-hero">
    <div class="home-hero-canvas-wrap">
        <canvas id="home-hero-canvas"></canvas>
    </div>
    <header class="entry-header">
        <h1>{{ .Title | markdownify }}</h1>
    </header>
    <div class="entry-content md-content">
        {{ $opts := dict "display" "block" }}
        {{ .Content | $.Page.RenderString $opts }}
    </div>
    <footer class="entry-footer">
        {{ partial "social_icons.html" (dict "align" site.Params.homeInfoParams.AlignSocialIconsTo) }}
    </footer>
</article>
<script>
(function () {
    var canvas = document.getElementById("home-hero-canvas");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var wrap = canvas.parentElement;
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function resize() {
        var dpr = window.devicePixelRatio || 1;
        canvas.width = wrap.clientWidth * dpr;
        canvas.height = wrap.clientHeight * dpr;
        ctx.scale(dpr, dpr);
        canvas.style.width = wrap.clientWidth + "px";
        canvas.style.height = wrap.clientHeight + "px";
    }
    resize();
    window.addEventListener("resize", resize);

    var W = function () { return wrap.clientWidth; };
    var H = function () { return wrap.clientHeight; };

    var PARTICLE_COUNT = 22;
    var CONNECT_DIST = 160;
    var particles = [];

    function getAccent() {
        var s = getComputedStyle(document.documentElement);
        return s.getPropertyValue("--accent").trim() || "#6d28d9";
    }

    function hexToRgb(hex) {
        hex = hex.replace("#", "");
        if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
        return {
            r: parseInt(hex.substring(0, 2), 16),
            g: parseInt(hex.substring(2, 4), 16),
            b: parseInt(hex.substring(4, 6), 16)
        };
    }

    function Particle() {
        this.x = Math.random() * W();
        this.y = Math.random() * H();
        this.vx = (Math.random() - 0.5) * 0.35;
        this.vy = (Math.random() - 0.5) * 0.35;
        this.r = 1.5 + Math.random() * 2;
        this.phase = Math.random() * Math.PI * 2;
        this.pulseSpeed = 0.008 + Math.random() * 0.015;
    }

    Particle.prototype.update = function () {
        this.x += this.vx;
        this.y += this.vy;
        this.phase += this.pulseSpeed;
        if (this.x < 0) this.x = W();
        if (this.x > W()) this.x = 0;
        if (this.y < 0) this.y = H();
        if (this.y > H()) this.y = 0;
    };

    Particle.prototype.draw = function (accent) {
        var pulse = 0.5 + 0.5 * Math.sin(this.phase);
        var alpha = 0.3 + 0.35 * pulse;
        var radius = this.r * (0.8 + 0.4 * pulse);

        ctx.beginPath();
        ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + accent.r + "," + accent.g + "," + accent.b + "," + alpha + ")";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x, this.y, radius + 3, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(" + accent.r + "," + accent.g + "," + accent.b + "," + (alpha * 0.25) + ")";
        ctx.lineWidth = 1;
        ctx.stroke();
    };

    for (var i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
    }

    function drawConnections(accent) {
        for (var i = 0; i < particles.length; i++) {
            for (var j = i + 1; j < particles.length; j++) {
                var dx = particles[i].x - particles[j].x;
                var dy = particles[i].y - particles[j].y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < CONNECT_DIST) {
                    var alpha = (1 - dist / CONNECT_DIST) * 0.2;
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = "rgba(" + accent.r + "," + accent.g + "," + accent.b + "," + alpha + ")";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }
    }

    function animate() {
        ctx.clearRect(0, 0, W(), H());
        var accent = hexToRgb(getAccent());

        drawConnections(accent);

        for (var i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw(accent);
        }

        if (!reduceMotion) {
            requestAnimationFrame(animate);
        }
    }

    animate();
})();
</script>
{{- end -}}
