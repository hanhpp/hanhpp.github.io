baseURL = 'https://hanhpham.vercel.app/'
locale = 'en-us'
title = "Hanh Pham's Blog"
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
pygmentsCodeFences = true
pygmentsUseClasses = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  title = "Hanh Pham's Blog"
  description = "Notes on code, security, and whatever else I'm poking at."
  author = "Hanh Pham"
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  disableSpecial1stPost = false
  comments = true

  # giscus (GitHub Discussions-backed comments, with reactions doubling as a
  # like/clap counter). Comments stay hidden until these are filled in --
  # see the setup steps in layouts/_partials/comments.html.
  [params.giscus]
    repo = "hanhpp/hanhpp.github.io"
    repoId = "MDEwOlJlcG9zaXRvcnk2NTgwODM1OA=="
    category = "Announcements"
    categoryId = "DIC_kwDOA-wn5s4DBt8q"
    mapping = "pathname"
    inputPosition = "bottom"
    lang = "en"

  [params.homeInfoParams]
    Title = "Hi there \U0001F44B"
    Content = "Software engineer building distributed backends by day, breaking binaries in CTFs by night. This is where I write down deep dives on Go, reverse engineering, microservices, and hardware architectures so future-me doesn't have to re-learn them."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/hanhpp"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/hanhphamphuoc/"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:hanhphamit@gmail.com"

[menu]
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 5
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'archives'
    name = 'Archive'
    url = '/archives/'
    weight = 15
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 30
  [[menu.main]]
    identifier = 'contact'
    name = 'Contact'
    url = '/contact/'
    weight = 40
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'monokai'
