baseURL = 'https://hanhpp.github.io/'
locale = 'en-us'
title = "Hanh Pham's Blog"
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
pygmentsCodeFences = true
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  title = "Hanh Pham's Blog"
  description = "Notes on code, security, and whatever else I'm poking at."
  author = "Hanh Pham"
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  disableSpecial1stPost = false

  [params.homeInfoParams]
    Title = "Hi there \U0001F44B"
    Content = "Welcome to my corner of the internet. This site is built with [Hugo](https://gohugo.io/) and the [PaperMod](https://github.com/adityatelange/hugo-PaperMod) theme, deployed automatically via GitHub Actions."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/hanhpp"

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 20

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'monokai'
