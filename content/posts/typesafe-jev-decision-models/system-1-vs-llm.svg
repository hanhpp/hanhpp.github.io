<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background container -->
  <rect x="1" y="1" width="958" height="518" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="36" y="38" font-size="18" font-weight="700" fill="#0f172a">Generative LLM vs. System 1 Decision Model</text>
  <text x="36" y="58" font-size="12" fill="#64748b">The architectural split: sequential token generation vs. parallel typed evaluation</text>

  <!-- LEFT BOX: TRADITIONAL GENERATIVE LLM -->
  <g transform="translate(36, 80)">
    <rect x="0" y="0" width="428" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="16" y="14" width="220" height="24" rx="4" fill="#e2e8f0"/>
    <text x="24" y="30" font-size="11" font-weight="700" fill="#334155" font-family="ui-monospace, 'Source Code Pro', monospace">TRADITIONAL GENERATIVE LLM</text>
    <text x="16" y="58" font-size="12" font-weight="600" fill="#0f172a">Autoregressive Next-Token Loop</text>
    <text x="16" y="74" font-size="11" fill="#64748b">GPT-4, Claude 3.5, Llama 3 (Prompt to String)</text>

    <!-- Step 1: Input -->
    <rect x="16" y="92" width="396" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="26" y="112" font-size="11" font-weight="600" fill="#0f172a">1. Input Context + System Prompt</text>
    <text x="26" y="130" font-size="10" fill="#64748b" font-family="ui-monospace, monospace">"Evaluate ticket... Respond in valid JSON schema..."</text>

    <!-- Connector -->
    <line x1="214" y1="144" x2="214" y2="164" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

    <!-- Step 2: Sequential Loop -->
    <rect x="16" y="164" width="396" height="78" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="26" y="184" font-size="11" font-weight="600" fill="#991b1b">2. Sequential Token Generation (O(N) Steps)</text>
    <text x="26" y="202" font-size="10" fill="#7f1d1d">Generates 200-2,000 tokens sequentially (20-40ms/token)</text>
    <text x="26" y="220" font-size="10" fill="#b91c1c" font-family="ui-monospace, monospace">Token 1 -> Token 2 -> ... -> "```json {"valid": true}"</text>

    <!-- Connector -->
    <line x1="214" y1="242" x2="214" y2="262" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

    <!-- Step 3: Unstructured String Output -->
    <rect x="16" y="262" width="396" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="26" y="282" font-size="11" font-weight="600" fill="#0f172a">3. Raw String Output to Host</text>
    <text x="26" y="300" font-size="10" fill="#dc2626">Requires regex cleaning, JSON parsing, Pydantic retry loops</text>

    <!-- Metrics Summary -->
    <g transform="translate(16, 332)">
      <rect x="0" y="0" width="396" height="54" rx="6" fill="#f1f5f9"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#334155">Latency:</text>
      <text x="65" y="20" font-size="11" fill="#dc2626" font-weight="600">1,500ms to 6,000ms</text>
      <text x="210" y="20" font-size="11" font-weight="700" fill="#334155">Output Cost:</text>
      <text x="285" y="20" font-size="11" fill="#dc2626" font-weight="600">High (Billed per token)</text>
      <text x="12" y="40" font-size="10" fill="#64748b">Probabilities uncalibrated (RLHF sycophancy bias)</text>
    </g>
  </g>

  <!-- RIGHT BOX: TYPESAFE JEV -->
  <g transform="translate(496, 80)">
    <rect x="0" y="0" width="428" height="400" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.8"/>
    <rect x="16" y="14" width="220" height="24" rx="4" fill="#6d28d9"/>
    <text x="24" y="30" font-size="11" font-weight="700" fill="#ffffff" font-family="ui-monospace, 'Source Code Pro', monospace">SYSTEM 1 DECISION ENGINE (JEV)</text>
    <text x="16" y="58" font-size="12" font-weight="600" fill="#1e1b4b">Non-Autoregressive Typed Evaluation</text>
    <text x="16" y="74" font-size="11" fill="#6d28d9">TypeSafe AI Jev (State to Typed Value)</text>

    <!-- Step 1: Input -->
    <rect x="16" y="92" width="396" height="52" rx="6" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="26" y="112" font-size="11" font-weight="600" fill="#1e1b4b">1. Shared Program State + Typed Queries</text>
    <text x="26" y="130" font-size="10" fill="#6d28d9" font-family="ui-monospace, monospace">questions: { "is_escalation": Bool, "intent": Choice }</text>

    <!-- Connector -->
    <line x1="214" y1="144" x2="214" y2="164" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2: Parallel Heads -->
    <rect x="16" y="164" width="396" height="78" rx="6" fill="#f3e8ff" stroke="#c084fc"/>
    <text x="26" y="184" font-size="11" font-weight="600" fill="#581c87">2. Single Forward Pass (Parallel Evaluation)</text>
    <text x="26" y="202" font-size="10" fill="#4c1d95">Encodes state once; parallel heads evaluate all questions at once</text>
    <text x="26" y="220" font-size="10" fill="#6d28d9" font-family="ui-monospace, monospace">Zero token decoding loop. No text generated.</text>

    <!-- Connector -->
    <line x1="214" y1="242" x2="214" y2="262" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 3: Native Primitives -->
    <rect x="16" y="262" width="396" height="56" rx="6" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="26" y="282" font-size="11" font-weight="600" fill="#1e1b4b">3. Native Typed Primitives + Confidence</text>
    <text x="26" y="300" font-size="10" fill="#15803d">Direct Python/JS types; zero string parsing or JSON overhead</text>

    <!-- Metrics Summary -->
    <g transform="translate(16, 332)">
      <rect x="0" y="0" width="396" height="54" rx="6" fill="#f3e8ff"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#581c87">Latency:</text>
      <text x="65" y="20" font-size="11" fill="#15803d" font-weight="600">70ms to 250ms</text>
      <text x="210" y="20" font-size="11" font-weight="700" fill="#581c87">Output Cost:</text>
      <text x="285" y="20" font-size="11" fill="#15803d" font-weight="600">Zero (No output tokens)</text>
      <text x="12" y="40" font-size="10" fill="#6d28d9">Statistically calibrated probabilities via RLCD</text>
    </g>
  </g>
</svg>