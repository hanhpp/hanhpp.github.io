<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .title { font-family: 'Poppins', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Source Code Pro', monospace; font-size: 12px; fill: #94a3b8; }
      .box { rx: 6px; stroke-width: 1.5; }
      .box-x86 { fill: #1e1b4b; stroke: #6366f1; }
      .box-arm { fill: #1e293b; stroke: #38bdf8; }
      .box-accent { fill: #2e1065; stroke: #a855f7; }
      .box-green { fill: #064e3b; stroke: #10b981; }
      .text-head { font-family: 'Source Code Pro', monospace; font-size: 12px; font-weight: 600; fill: #f1f5f9; text-anchor: middle; }
      .text-sub { font-family: 'Source Code Pro', monospace; font-size: 10px; fill: #94a3b8; text-anchor: middle; }
      .text-accent { font-family: 'Source Code Pro', monospace; font-size: 10px; fill: #c084fc; text-anchor: middle; }
      .text-green { font-family: 'Source Code Pro', monospace; font-size: 10px; fill: #34d399; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
      .arrow-accent { stroke: #a855f7; stroke-width: 2; marker-end: url(#arrowhead-accent); fill: none; }
      .divider { stroke: #334155; stroke-dasharray: 4 4; stroke-width: 1.5; }
      .label-col { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; fill: #cbd5e1; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" class="bg" />

  <!-- Headers -->
  <text x="40" y="38" class="title">Modern Frontend Topologies: Where the Silicon Budget Goes</text>
  <text x="40" y="58" class="subtitle">x86-64 Variable Length Cache Dependency vs Apple Silicon Fixed 4-Byte Direct Slicing</text>

  <!-- Divider -->
  <line x1="450" y1="80" x2="450" y2="440" class="divider" />

  <!-- Left: x86 (AMD Zen 5 / Intel Lion Cove) -->
  <text x="60" y="105" class="label-col">x86-64: The Decoder Tax Paid in Cache Silicon</text>

  <!-- L1I Cache -->
  <rect x="60" y="125" width="330" height="45" class="box box-x86" />
  <text x="225" y="145" class="text-head">L1 Instruction Cache (32KB - 64KB)</text>
  <text x="225" y="160" class="text-sub">16 to 32 bytes fetched per cycle</text>

  <!-- Flow down to Decoders & uOp Cache -->
  <path d="M 140 170 L 140 215" class="arrow" />
  <path d="M 310 170 L 310 215" class="arrow-accent" />

  <!-- Complex Decoder Box -->
  <rect x="60" y="215" width="160" height="85" class="box box-x86" />
  <text x="140" y="238" class="text-head">Length Speculation</text>
  <text x="140" y="254" class="text-head">&amp; Predecode Arrays</text>
  <text x="140" y="272" class="text-sub">1 to 15 byte variable</text>
  <text x="140" y="286" class="text-accent">4 to 8 wide bottleneck</text>

  <!-- uOp Cache Box (The Savior) -->
  <rect x="230" y="215" width="160" height="85" class="box box-accent" />
  <text x="310" y="238" class="text-head">Decoded uOp Cache</text>
  <text x="310" y="254" class="text-sub">Zen 5: 6K entries (12/cyc)</text>
  <text x="310" y="270" class="text-sub">Lion Cove: ~5.2K entries</text>
  <text x="310" y="288" class="text-green">Bypasses legacy decode</text>

  <!-- Paths to uOp Queue -->
  <path d="M 140 300 L 140 345 L 210 345 L 210 365" class="arrow" />
  <path d="M 310 300 L 310 345 L 240 345 L 240 365" class="arrow-accent" />

  <!-- Unified uOp Queue -->
  <rect x="60" y="365" width="330" height="50" class="box box-x86" />
  <text x="225" y="387" class="text-head">Micro-Op Queue &amp; Allocation Buffer</text>
  <text x="225" y="403" class="text-sub">Feeds execution backend at 8 to 12 uOps/cycle</text>


  <!-- Right: Apple Silicon (Firestorm / M-Series) -->
  <text x="490" y="105" class="label-col">Apple Silicon: The Direct 8-Wide Slicing Trade</text>

  <!-- Massive L1I Cache -->
  <rect x="490" y="125" width="350" height="55" class="box box-arm" />
  <text x="665" y="148" class="text-head">Massive L1 Instruction Cache (192KB)</text>
  <text x="665" y="165" class="text-green">3x larger than x86 to offset code expansion</text>

  <path d="M 665 180 L 665 225" class="arrow-accent" />

  <!-- Direct 8-Wide Decoder -->
  <rect x="490" y="225" width="350" height="75" class="box box-green" />
  <text x="665" y="248" class="text-head">Direct 8-Wide Instruction Decoder</text>
  <text x="665" y="265" class="text-sub">Every instruction is strictly 4 bytes (32-bit aligned)</text>
  <text x="665" y="283" class="text-green">Zero length speculation: 32B fetch = exact 8 instructions</text>

  <path d="M 665 300 L 665 365" class="arrow-accent" />

  <!-- Instruction Queue -->
  <rect x="490" y="365" width="350" height="50" class="box box-arm" />
  <text x="665" y="387" class="text-head">Instruction Queue &amp; Rename Dispatch</text>
  <text x="665" y="403" class="text-sub">No uOp cache needed: decode feeds backend directly</text>

  <!-- Bottom Note -->
  <text x="225" y="440" class="text-sub">x86 pays transistor area for uOp Cache to escape decode</text>
  <text x="665" y="440" class="text-sub">Apple pays transistor area for 192KB L1I to feed 8-wide decode</text>
</svg>
