<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .title { font-family: 'Poppins', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Source Code Pro', monospace; font-size: 12px; fill: #94a3b8; }
      .card { rx: 8px; stroke-width: 1.5; }
      .card-human { fill: #1e1b4b; stroke: #818cf8; }
      .card-ai { fill: #2e1065; stroke: #c084fc; }
      .card-loop { fill: #064e3b; stroke: #34d399; }
      .col-header { font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 700; }
      .item-title { font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
      .item-desc { font-family: 'Source Code Pro', monospace; font-size: 11px; fill: #cbd5e1; }
      .arrow-text { font-family: 'Source Code Pro', monospace; font-size: 11px; font-weight: 600; fill: #e2e8f0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="920" height="520" class="bg" />

  <!-- Header -->
  <text x="40" y="38" class="title">The Meta-Learning Loop: Human Metacognition &amp; Personal AI Scaffolding</text>
  <text x="40" y="58" class="subtitle">Active Cognitive Coupling (Clark &amp; Chalmers 1998) vs Passive Outsourcing Atrophy</text>

  <!-- Left: Human Metacognition (Flavell 1979) -->
  <g transform="translate(40, 85)">
    <rect width="395" height="270" class="card card-human" />
    <text x="20" y="28" class="col-header" fill="#818cf8">HUMAN METACOGNITIVE REGULATION</text>
    <text x="20" y="48" class="item-desc" fill="#94a3b8">John Flavell (1979) • Thinking About How We Think</text>

    <!-- Item 1 -->
    <g transform="translate(20, 68)">
      <rect width="355" height="54" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
      <text x="14" y="20" class="item-title">1. Metacognitive Knowledge</text>
      <text x="14" y="38" class="item-desc">Awareness of personal biases, limits, and knowledge gaps.</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(20, 132)">
      <rect width="355" height="54" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
      <text x="14" y="20" class="item-title">2. Metacognitive Monitoring</text>
      <text x="14" y="38" class="item-desc">Catching the Illusion of Competence before deploying code.</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(20, 196)">
      <rect width="355" height="54" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
      <text x="14" y="20" class="item-title">3. Strategy Regulation</text>
      <text x="14" y="38" class="item-desc">Choosing when to calculate vs when to prompt and verify.</text>
    </g>
  </g>

  <!-- Right: Personal AI Dynamic Scaffold (Bruner / Vygotsky) -->
  <g transform="translate(485, 85)">
    <rect width="395" height="270" class="card card-ai" />
    <text x="20" y="28" class="col-header" fill="#c084fc">PERSONAL AI DYNAMIC SCAFFOLD</text>
    <text x="20" y="48" class="item-desc" fill="#e9d5ff">Extended Mind (Clark &amp; Chalmers 1998) • Zone of Proximal Dev</text>

    <!-- Item 1 -->
    <g transform="translate(20, 68)">
      <rect width="355" height="54" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
      <text x="14" y="20" class="item-title">1. Adversarial Hypothesis Probing</text>
      <text x="14" y="38" class="item-desc">Probing assumptions, finding counterexamples to models.</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(20, 132)">
      <rect width="355" height="54" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
      <text x="14" y="20" class="item-title">2. Socratic Boundary Enforcement</text>
      <text x="14" y="38" class="item-desc">Refusing passive answers; asking guiding diagnostic questions.</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(20, 196)">
      <rect width="355" height="54" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
      <text x="14" y="20" class="item-title">3. Persistent External Working Memory</text>
      <text x="14" y="38" class="item-desc">Auditing historical cognitive blind spots and decision records.</text>
    </g>
  </g>

  <!-- Bottom: The Cybernetic Synthesis (The Meta-Human Advantage) -->
  <g transform="translate(40, 375)">
    <rect width="840" height="115" class="card card-loop" />
    <text x="24" y="28" class="col-header" fill="#34d399">THE CYBERNETIC ADVANTAGE: CO-EVOLUTIONARY LEAP</text>
    <text x="24" y="50" class="item-desc" fill="#e2e8f0">Passive Users: Outsource thinking to AI -> Suffer cognitive atrophy, loss of mental schemas, and blind overconfidence.</text>
    <text x="24" y="70" class="item-desc" fill="#a7f3d0">Meta-Humans: Steer personal AI via metacognitive monitoring -> AI acts as an intellectual sparring partner, not a crutch.</text>
    <text x="24" y="90" class="item-desc" fill="#cbd5e1">The human elevates the AI by defining invariants; the AI elevates the human by accelerating the metacognitive feedback loop.</text>
  </g>
</svg>
