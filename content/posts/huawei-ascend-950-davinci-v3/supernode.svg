  </g>
  <rect x="676" y="226" width="50" height="18" rx="5" fill="#f3e8ff" stroke="#d8b4fe"/>
  <rect x="756" y="226" width="50" height="18" rx="5" fill="#f3e8ff" stroke="#d8b4fe"/>
  <rect x="836" y="226" width="50" height="18" rx="5" fill="#f3e8ff" stroke="#d8b4fe"/>
  <g stroke="#c4b5fd" stroke-width="1">
    <line x1="701" y1="244" x2="701" y2="262"/><line x1="781" y1="244" x2="781" y2="262"/><line x1="861" y1="244" x2="861" y2="262"/>
  </g>
  <g fill="#6d28d9" fill-opacity="0.25" stroke="#6d28d9" stroke-width="0.8">
    <rect x="672" y="262" width="14" height="14" rx="2"/><rect x="690" y="262" width="14" height="14" rx="2"/><rect x="708" y="262" width="14" height="14" rx="2"/><rect x="726" y="262" width="14" height="14" rx="2"/><rect x="744" y="262" width="14" height="14" rx="2"/><rect x="762" y="262" width="14" height="14" rx="2"/><rect x="780" y="262" width="14" height="14" rx="2"/><rect x="798" y="262" width="14" height="14" rx="2"/><rect x="816" y="262" width="14" height="14" rx="2"/><rect x="834" y="262" width="14" height="14" rx="2"/><rect x="852" y="262" width="14" height="14" rx="2"/><rect x="870" y="262" width="14" height="14" rx="2"/>
    <rect x="672" y="280" width="14" height="14" rx="2"/><rect x="690" y="280" width="14" height="14" rx="2"/><rect x="708" y="280" width="14" height="14" rx="2"/><rect x="726" y="280" width="14" height="14" rx="2"/><rect x="744" y="280" width="14" height="14" rx="2"/><rect x="762" y="280" width="14" height="14" rx="2"/><rect x="780" y="280" width="14" height="14" rx="2"/><rect x="798" y="280" width="14" height="14" rx="2"/><rect x="816" y="280" width="14" height="14" rx="2"/><rect x="834" y="280" width="14" height="14" rx="2"/><rect x="852" y="280" width="14" height="14" rx="2"/><rect x="870" y="280" width="14" height="14" rx="2"/>
    <rect x="672" y="298" width="14" height="14" rx="2"/><rect x="690" y="298" width="14" height="14" rx="2"/><rect x="708" y="298" width="14" height="14" rx="2"/><rect x="726" y="298" width="14" height="14" rx="2"/><rect x="744" y="298" width="14" height="14" rx="2"/><rect x="762" y="298" width="14" height="14" rx="2"/><rect x="780" y="298" width="14" height="14" rx="2"/><rect x="798" y="298" width="14" height="14" rx="2"/><rect x="816" y="298" width="14" height="14" rx="2"/><rect x="834" y="298" width="14" height="14" rx="2"/><rect x="852" y="298" width="14" height="14" rx="2"/><rect x="870" y="298" width="14" height="14" rx="2"/>
  </g>
  <text x="800" y="336" font-size="10.5" fill="#1d1d1f" text-anchor="middle">8,192 chips · Clos over UB Switches</text>
  <text x="800" y="354" font-size="10.5" fill="#555555" text-anchor="middle">8 EFLOPS FP8 · 16 EFLOPS FP4 (keynote, 2025)</text>

  <!-- callouts -->
  <rect x="60" y="400" width="430" height="140" rx="12" fill="#faf7ff" stroke="#d8b4fe"/>
  <text x="80" y="428" font-size="11.5" fill="#6d28d9" font-weight="600" letter-spacing="1" font-family="ui-monospace, 'Source Code Pro', monospace">PD SEPARATION, HARDWARE-NATIVE</text>
  <g font-size="10.8" fill="#1d1d1f">
    <text x="80" y="454">• Prefill is compute-bound; decode is memory-bound</text>
    <text x="94" y="472">  (Splitwise ISCA'24, DistServe OSDI'24)</text>
    <text x="80" y="496">• CloudMatrix-Infer scales the two pools independently</text>
    <text x="94" y="514">  over one UB fabric, up to EP320 expert parallelism</text>
    <text x="80" y="534">• DeepSeek-R1 on CM384: 6,688 tok/s prefill · 1,943 tok/s decode / NPU</text>
  </g>

  <rect x="520" y="400" width="380" height="140" rx="12" fill="#faf7ff" stroke="#d8b4fe"/>
  <text x="540" y="428" font-size="11.5" fill="#6d28d9" font-weight="600" letter-spacing="1" font-family="ui-monospace, 'Source Code Pro', monospace">ONE FABRIC, THREE SEMANTICS</text>
  <g font-size="10.8" fill="#1d1d1f">
    <text x="540" y="454">• UB Memory: sync Load/Store/Atomic across</text>
    <text x="554" y="472">  a shared space of up to 128 TB</text>
    <text x="540" y="496">• URMA: async copies over RTP (reliable) or</text>
    <text x="554" y="514">  CTP (light) transport</text>
    <text x="540" y="534">• UBoE: UB over standard Ethernet switches</text>
  </g>

  <text x="36" y="584" font-size="10.5" fill="#86868b">Scale-up domain comparison: NVIDIA NVL72 = 72 GPUs · Atlas 950 SuperPoD = 8,192 NPUs (Huawei keynote, Sep 2025). Clusters beyond the SuperPoD scale past 128K cards.</text>
</svg>
