<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="1" y="1" width="958" height="558" rx="14" fill="#ffffff" stroke="#e5e5e7"/>
  <text x="36" y="44" font-size="17" font-weight="600" fill="#1d1d1f">Memory bandwidth decides decode speed</text>
  <text x="36" y="66" font-size="12" fill="#555555">Per-chip bandwidth, Apple-published vs Huawei white-paper figures. Autoregressive decode is bandwidth-bound on both platforms (Apple's MLX team says so itself).</text>

  <g font-size="11.5" fill="#1d1d1f" text-anchor="end" font-family="ui-monospace, 'Source Code Pro', monospace">
    <text x="240" y="141">M4</text>
    <text x="240" y="197">M4 Pro</text>
    <text x="240" y="253">M4 Max</text>
    <text x="240" y="309">M3 Ultra</text>
    <text x="240" y="365">Ascend 950PR</text>
    <text x="240" y="421">Ascend 950DT</text>
  </g>

  <g>
    <rect x="250" y="128" width="19" height="22" rx="4" fill="#86868b" fill-opacity="0.55"/>
    <text x="277" y="144" font-size="11" fill="#555555" font-family="ui-monospace, 'Source Code Pro', monospace">120 GB/s</text>
    <rect x="250" y="184" width="44" height="22" rx="4" fill="#86868b" fill-opacity="0.55"/>
    <text x="302" y="200" font-size="11" fill="#555555" font-family="ui-monospace, 'Source Code Pro', monospace">273 GB/s</text>
    <rect x="250" y="240" width="87" height="22" rx="4" fill="#86868b" fill-opacity="0.55"/>
    <text x="345" y="256" font-size="11" fill="#555555" font-family="ui-monospace, 'Source Code Pro', monospace">546 GB/s</text>
    <rect x="250" y="296" width="131" height="22" rx="4" fill="#86868b" fill-opacity="0.75"/>
    <text x="389" y="312" font-size="11" fill="#555555" font-family="ui-monospace, 'Source Code Pro', monospace">819 GB/s</text>
    <rect x="250" y="352" width="256" height="22" rx="4" fill="#6d28d9" fill-opacity="0.65"/>
    <text x="514" y="368" font-size="11" fill="#6d28d9" font-family="ui-monospace, 'Source Code Pro', monospace">1,600 GB/s</text>
    <rect x="250" y="408" width="640" height="22" rx="4" fill="#6d28d9"/>
    <text x="874" y="424" font-size="11" fill="#555555" font-family="ui-monospace, 'Source Code Pro', monospace">4,000 GB/s</text>
  </g>

  <line x1="250" y1="446" x2="890" y2="446" stroke="#e5e5e7" stroke-width="1"/>
  <text x="250" y="470" font-size="11" fill="#6d28d9" font-family="ui-monospace, 'Source Code Pro', monospace">950DT = 7.3× M4 Max</text>
  <text x="420" y="470" font-size="11" fill="#555555">and it still fills a rack with 8,191 more chips, each with that same pipe</text>

  <text x="36" y="510" font-size="11" fill="#1d1d1f">A 70B model at 4-bit decodes at ~10 tok/s on an M4 Max (bandwidth / model bytes). On the 950DT, the same arithmetic says ~75 tok/s, before the fabric pools any of it.</text>
  <text x="36" y="534" font-size="10.5" fill="#86868b">Apple figures: Apple newsroom (M4 May 2024, M4 Pro/Max Oct 2024, M3 Ultra Mar 2025). Ascend figures: Ascend 950 NPU Architecture White Paper (2026). tok/s arithmetic: bandwidth / model bytes, before overheads.</text>
</svg>
