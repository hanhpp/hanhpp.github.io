<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hanh.me</title>
<meta name="robots" content="noindex">
<script>
/* GitHub Pages answers every unknown path with this file, so the path is rebuilt against the new
   host rather than dropped: an old deep link keeps its destination. */
var path = location.pathname + location.search + location.hash;
location.replace("https://hanh.me" + path);
</script>
</head>
<body>
<p>This page moved to <a id="moved" href="https://hanh.me/">hanh.me</a>.</p>
<script>document.getElementById("moved").href = "https://hanh.me" + location.pathname + location.search + location.hash;</script>
</body>
</html>
