<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://hanhpham.vercel.app/">
</head>
<body>
<p>Redirecting to <a href="https://hanhpham.vercel.app/">hanhpham.vercel.app</a>.</p>
<script>
  // Deep links keep their path, query, and hash so old post URLs still resolve.
  location.replace("https://hanhpham.vercel.app" + location.pathname + location.search + location.hash);
</script>
</body>
</html>
